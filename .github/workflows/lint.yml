name: Go Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pinned so a new golangci-lint release cannot turn CI red without a
        # commit here. Dependabot bumps the action, not this input, so raise
        # it by hand.
        version: v2.13.2
